name: Build and Push Docker to ECR

on:
  workflow_dispatch:  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: AKIA4RCAOO474QU33XK4
          aws-secret-access-key: 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
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Download Dockerfile from S3
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://mmnm-0987/
          aws s3 cp s3://mmnm-0987/Dockerfile ./Dockerfile

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          IMAGE_URI=861276108607.dkr.ecr.ap-south-1.amazonaws.com/sample-app:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push Docker image to ECR
        run: |
          docker push $IMAGE_URI

      - name: Update ArgoCD deployment manifest
        run: |
          sed -i "s|image:.*|image: $IMAGE_URI|" modules/nodeapp.yaml

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/deepth-kg/projects.git

          git add modules/nodeapp.yaml
          git commit -m "Update image tag to $IMAGE_URI"
          git push origin develop
