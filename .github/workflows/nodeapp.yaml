name: Build and Push Docker to ECR

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository with PAT for write access
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: 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

      # 2️⃣ Configure AWS credentials securely via GitHub secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: AKIA4RCAOO474QU33XK4
          aws-secret-access-key: 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
          aws-region: ap-south-1

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # 4️⃣ Download Dockerfile from S3
      - name: Download Dockerfile from S3
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://mmnm-0987/
          aws s3 cp s3://mmnm-0987/Dockerfile ./Dockerfile

      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: |
          set -e
          IMAGE_TAG=${GITHUB_SHA::8}
          IMAGE_URI=861276108607.dkr.ecr.ap-south-1.amazonaws.com/sample-app:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # 6️⃣ Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          set -e
          docker push $IMAGE_URI

      # 7️⃣ Update ArgoCD deployment manifest and commit
      - name: Update ArgoCD deployment manifest
        run: |
          set -e
          # Update image in YAML
          sed -i "s|image:.*|image: $IMAGE_URI|" modules/nodeapp.yaml
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          
          # Commit changes
          git add modules/nodeapp.yaml
          git commit -m "Update image tag to $IMAGE_URI"
          
          # Push changes back to develop branch
          git push origin develop
